name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "No signing key registered. Using a temporary debug key."
          fi

      - name: Build APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --continue

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          for m in camera gallery video music notes calendar calculator alarm files; do
            f=$(ls $m/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              name="$(echo ${m:0:1} | tr a-z A-Z)${m:1}"
              cp "$f" "out/$name.apk"
            else
              echo "::warning::$m のAPKは作られませんでした"
            fi
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlainApps-apk
          path: out/*.apk
